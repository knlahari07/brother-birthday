<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chidu Anna ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #fff5f8;
    color: #5b2438;
    text-align: center;
    overflow-x: hidden;
}

section {
    padding: 65px 18px;
}

h1 {
    font-size: clamp(2.3rem, 7vw, 4rem);
    color: #d6336c;
    margin-bottom: 20px;
}

h2 {
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    color: #c2255c;
    margin-bottom: 25px;
}

p {
    line-height: 1.8;
    font-size: 1.05rem;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    background: #d6336c;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    margin: 12px 5px;
    box-shadow: 0 5px 15px rgba(180, 30, 85, 0.2);
    transition: 0.3s;
}

button:hover {
    background: #a61e4d;
    transform: translateY(-3px);
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe0eb, #ffc2d1, #fff0f5);
    padding: 35px 20px;
}

.hero .emoji {
    font-size: 4rem;
    margin-bottom: 20px;
    animation: heartbeat 1.5s infinite;
}

.hero p {
    max-width: 650px;
    margin: 10px auto;
}

.subtitle {
    font-size: 1.2rem;
    color: #8a284b;
}

.message-section {
    background: #fffafd;
}

.message-card {
    max-width: 850px;
    margin: auto;
    padding: 30px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 8px 30px rgba(160, 40, 90, 0.1);
    border: 1px solid #ffe0eb;
}

.message-card p {
    margin-bottom: 17px;
    text-align: left;
}

.gallery-section {
    background: linear-gradient(135deg, #fff0f5, #ffe0eb);
}
