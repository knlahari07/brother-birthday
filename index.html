<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Chidu Anna ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    color: #4a1f2d;
    text-align: center;
    overflow-x: hidden;
}

section {
    min-height: 100vh;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.hero {
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

h1 {
    font-size: clamp(2.5rem, 10vw, 5rem);
    margin-bottom: 20px;
}

h2 {
    font-size: 2rem;
    margin-bottom: 25px;
}

p {
    max-width: 700px;
    line-height: 1.8;
    font-size: 1.1rem;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    background: #ff477e;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    transform: scale(1.05);
}

/* Photo gallery */

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    max-width: 800px;
    width: 100%;
    margin-top: 25px;
}

.photo {
    height: 220px;
    border-radius: 20px;
    overflow: hidden;
    background: white;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Birthday message */

.message {
    background: rgba(255,255,255,0.75);
    padding: 30px;
    border-radius: 25px;
    max-width: 800px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* Birthday cake */

.cake {
    font-size: 120px;
    cursor: pointer;
    transition: transform 0.3s;
}

.cake:hover {
    transform: scale(1.1);
}

/* Song section */

.song-section {
    background: linear-gradient(135deg, #ffe0e9, #ffc2d1);
}

.song-card {
    width: 100%;
    max-width: 600px;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.song-card iframe {
    width: 100%;
    height: 200px;
    border: none;
    border-radius: 15px;
    margin-top: 20px;
}

/* Final message */

.final {
    background: #2b1020;
    color: white;
}

/* Floating hearts */

.heart {
    position: fixed;
    bottom: -40px;
    font-size: 25px;
    pointer-events: none;
    z-index: 2;
    animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }

    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
